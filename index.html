<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2c"><title>HYBRID PERFORMANCE — dnevnik</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#eaf0fa;background:#0b1220}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}header{background:#111d31;padding:22px 18px 17px;border-bottom:1px solid #283b53}h1{font-size:22px;margin:0;letter-spacing:.3px}h2{font-size:18px;margin:0 0 12px}p{line-height:1.45}small,.muted{color:#9aaac0}main{max-width:720px;margin:auto;padding:16px}.card{background:#152238;border:1px solid #30415b;border-radius:17px;padding:15px;margin-bottom:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.stack{display:flex;flex-direction:column;gap:7px}.pill{background:#243754;color:#bcd5ff;border-radius:20px;padding:5px 10px;font-size:12px}button,select,input,textarea{font:inherit}button{background:#356bf2;color:white;border:0;border-radius:11px;padding:11px 13px;font-weight:650;cursor:pointer}button.secondary{background:#263950;color:#eaf0fa}button.danger{background:#4c2d37;color:#ffd2d9}button:disabled{opacity:.5}input,select,textarea{background:#0e192a;color:#fff;border:1px solid #41536b;border-radius:9px;padding:9px;min-width:0;width:100%}input[type=date]{max-width:170px}input[type=checkbox]{width:23px;height:23px;accent-color:#63d9a0}label{font-size:12px;color:#a9b9cd}nav{position:fixed;bottom:0;left:0;right:0;background:#101b2d;border-top:1px solid #30415b;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;background:transparent;color:#a6b5cb;padding:9px 2px;font-size:12px}nav button.active{background:#253b61;color:#fff}.exercise{border-top:1px solid #30415b;padding-top:14px;margin-top:14px}.setgrid{display:grid;grid-template-columns:40px 1fr 1fr 55px 32px;gap:7px;align-items:center;margin:7px 0}.setgrid input{padding:10px 5px;text-align:center}.setgrid .remove{background:transparent;color:#aab8c9;padding:6px}.subtle{font-size:12px;color:#93a6be}.notice{background:#243047;border-left:3px solid #f6c46d;padding:12px;border-radius:8px;font-size:13px}.success{color:#6be0a7}.hidden{display:none}.flex{display:flex;gap:8px;flex-wrap:wrap}.full{width:100%}.progress{height:7px;background:#2c3b52;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#62d5a0}.empty{padding:30px 10px;text-align:center;color:#9caec5}textarea{min-height:75px;resize:vertical}.history-item{border-bottom:1px solid #2c3e55;padding:12px 0}.tag{font-size:11px;color:#96b9ff}.day{font-weight:700}.badge{color:#86e7bd;font-size:12px}.filelabel{display:inline-block;background:#263950;padding:11px;border-radius:10px;cursor:pointer}#toast{position:fixed;top:12px;left:10%;width:80%;background:#22543d;color:#fff;padding:12px;border-radius:10px;text-align:center;display:none;z-index:20}@media(max-width:360px){.setgrid{grid-template-columns:28px 1fr 1fr 42px 27px;gap:4px}.card{padding:11px}}
</style></head><body><header><div style="max-width:720px;margin:auto"><div class="row"><div><small>TRAIN • TRACK • PROGRESS</small><h1>HYBRID PERFORMANCE</h1></div><span class="pill">2026 / 2027</span></div><div class="muted" style="font-size:13px;margin-top:7px">Tvoj osebni dnevnik • brez naročnine</div></div></header><main><div id="screen"></div></main><nav id="nav"></nav><div id="toast"></div><script>
'use strict';const KEY='hybrid_performance_v1';const weekdays=['Nedelja','Ponedeljek','Torek','Sreda','Četrtek','Petek','Sobota'];const program=[
{day:1,name:'Regeneracija in mobilnost',type:'mobility',minutes:20,ex:[['Cat-cow',2,8,0],['Torakalne rotacije',2,8,0],['Dihanje s prepono',2,8,0],['Raztezanje prsnih mišic',2,30,0]]},
{day:2,name:'Upper Strength + Bike Z2',type:'strength',minutes:90,ex:[['Bench press',4,6,80],['Weighted pull-up / assisted pull-up',4,6,0],['Incline dumbbell press',3,10,0],['Chest-supported row',3,10,0],['Lateral raise',3,15,0],['Triceps pushdown',2,15,0]],bike:{minutes:30,kind:'Z2',rpe:'3–4'}},
{day:3,name:'Bike – aerobna priprava',type:'bike',minutes:50,ex:[],bike:{minutes:40,kind:'Z2 (začetna faza)',rpe:'3–4'}},
{day:4,name:'Lahke noge + core',type:'strength',minutes:55,ex:[['Glute bridge',3,15,0],['Lying hamstring curl (lahko)',3,15,0],['Seated hip abduction (lahko)',3,20,0],['Seated hip adduction (lahko)',2,15,0],['Dead bug',3,10,0],['Side plank (sekund)',3,35,0]]},
{day:5,name:'Počitek in mobilnost',type:'mobility',minutes:15,ex:[['Dihanje s prepono',2,8,0],['Torakalne rotacije',2,8,0]]},
{day:6,name:'Upper Hypertrophy + Bike Z2',type:'strength',minutes:100,ex:[['Incline bench press',3,12,0],['Lat pulldown',3,12,0],['Seated cable row',3,12,0],['Dumbbell shoulder press',3,12,0],['Rear delt fly',3,20,0],['Cable lateral raise',3,20,0],['Hammer curl',2,15,0],['Triceps pushdown',2,15,0]],bike:{minutes:30,kind:'Z2',rpe:'3–4'}},
{day:0,name:'Dolgo kolesarjenje Z2',type:'bike',minutes:100,ex:[],bike:{minutes:90,kind:'Z2',rpe:'3–4'}}];
const isoLocal=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:{},settings:{}}}catch(e){state={sessions:{},settings:{}}}let tab='today',date=isoLocal(),viewHistory=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Shranjevanje ni uspelo – izvozi varnostno kopijo!');return false}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function templateFor(d){return program.find(x=>x.day===new Date(d+'T12:00:00').getDay())}
function newSession(d){let p=templateFor(d);return {date:d,name:p.name,type:p.type,done:false,notes:'',pain:'',ex:p.ex.map(x=>({name:x[0],target:x[2],rpe:'7',sets:Array.from({length:x[1]},()=>({kg:x[3]||'',reps:'',done:false}))})),bike:p.bike?{...p.bike,actualMinutes:'',watts:'',hr:'',cadence:'',done:false}:null}}
function getSession(d){if(!state.sessions[d]){state.sessions[d]=newSession(d);save()}return state.sessions[d]}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function progress(s){let a=s.ex.flatMap(x=>x.sets.map(z=>z.done));if(s.bike)a.push(s.bike.done);return a.length?Math.round(a.filter(Boolean).length/a.length*100):0}
function render(){document.getElementById('nav').innerHTML=[['today','Danes','calendar-days'],['history','Zgodovina','history'],['plan','Program','clipboard-list'],['backup','Podatki','database']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="switchTab('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('screen').innerHTML=tab==='today'?today():tab==='history'?history():tab==='plan'?plan():backup()}
function switchTab(t){tab=t;viewHistory=null;render()}
function today(){let s=getSession(date),pct=progress(s);return `<div class="card"><div class="row"><div><small>IZBRANI DATUM</small><h2 style="margin:4px 0">${esc(fmt(date))}</h2></div><input aria-label="Datum" type="date" value="${date}" onchange="date=this.value;render()"></div><h2 style="margin-top:14px">${esc(s.name)}</h2><div class="row"><small>Opravljene serije in kolesarjenje</small><b>${pct}%</b></div><div class="progress" style="margin:8px 0 10px"><div style="width:${pct}%"></div></div><div class="flex"><button class="secondary" onclick="shiftDate(-1)">← Prejšnji dan</button><button class="secondary" onclick="shiftDate(1)">Naslednji dan →</button></div></div><div class="notice" style="margin-bottom:13px">Golen: samo neboleče vaje, ki jih je dovolil travmatolog. VO₂max intervali šele po potrditvi, da je tudi intenzivno kolesarjenje primerno. Če se bolečina pojavi med vadbo ali naslednje jutro, zmanjšaj obremenitev in se posvetuj z zdravnikom.</div>${s.ex.length?`<div class="card"><h2>Vaje in serije</h2><small>Vpiši kg in dejanske ponovitve za vsako serijo posebej.</small>${s.ex.map((e,i)=>exerciseHtml(e,i)).join('')}<button class="secondary full" style="margin-top:14px" onclick="addExercise()">+ Dodaj vajo</button></div>`:`<div class="card"><p>Dan je namenjen ${s.type==='bike'?'kolesarjenju':'regeneraciji'}.</p><button class="secondary" onclick="addExercise()">+ Dodaj vajo</button>${s.ex.map((e,i)=>exerciseHtml(e,i)).join('')}</div>`}${s.bike?bikeHtml(s.bike):''}<div class="card stack"><h2>Po treningu</h2><label>Bolečina v goleni (0–10)</label><select onchange="field('pain',this.value)"><option value="">Izberi</option>${Array.from({length:11},(_,i)=>`<option ${String(s.pain)===String(i)?'selected':''} value="${i}">${i}</option>`).join('')}</select><label>Opombe / počutje / RPE</label><textarea placeholder="Kako je šlo? Bolečina, energija, opažanja ..." oninput="field('notes',this.value)">${esc(s.notes)}</textarea><label class="row" style="justify-content:flex-start;font-size:15px;color:#eaf0fa"><input type="checkbox" ${s.done?'checked':''} onchange="field('done',this.checked)"> Označi celoten trening kot zaključen</label><small class="success">Spremembe se samodejno shranjujejo v tem brskalniku.</small></div>`}
function exerciseHtml(e,i){return `<section class="exercise"><div class="row"><div><b>${esc(e.name)}</b><div class="subtle">${e.sets.length} serij • cilj ${esc(e.target)} ponovitev • RPE ${esc(e.rpe)}</div></div><button class="secondary" style="padding:7px 9px" onclick="editExercise(${i})">Uredi</button></div><div class="setgrid" style="margin-top:12px"><label>Ser.</label><label style="text-align:center">Kg</label><label style="text-align:center">Pon.</label><label style="text-align:center">✓</label><label></label></div>${e.sets.map((z,j)=>`<div class="setgrid"><b>${j+1}</b><input type="number" step="0.5" inputmode="decimal" aria-label="Teža serija ${j+1}" value="${esc(z.kg)}" oninput="setField(${i},${j},'kg',this.value)"><input type="number" step="1" inputmode="numeric" aria-label="Ponovitve serija ${j+1}" value="${esc(z.reps)}" oninput="setField(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Končana serija ${j+1}" ${z.done?'checked':''} onchange="setField(${i},${j},'done',this.checked);render()"><button class="remove" aria-label="Odstrani serijo" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<button class="secondary" style="margin-top:6px;padding:8px 12px" onclick="addSet(${i})">+ Serija</button></section>`}
function bikeHtml(b){return `<div class="card stack"><h2>🚴 Sobno kolo</h2><div class="row"><span class="pill">${esc(b.kind)}</span><span class="pill">Cilj ${esc(b.minutes)} min • RPE ${esc(b.rpe)}</span></div><div class="row"><div style="flex:1"><label>Trajanje (min)</label><input type="number" inputmode="numeric" value="${esc(b.actualMinutes)}" oninput="bikeField('actualMinutes',this.value)"></div><div style="flex:1"><label>Povp. vati (W)</label><input type="number" inputmode="numeric" value="${esc(b.watts)}" oninput="bikeField('watts',this.value)"></div></div><div class="row"><div style="flex:1"><label>Povp. utrip (bpm)</label><input type="number" inputmode="numeric" value="${esc(b.hr)}" oninput="bikeField('hr',this.value)"></div><div style="flex:1"><label>Kadenca (rpm)</label><input type="number" inputmode="numeric" value="${esc(b.cadence)}" oninput="bikeField('cadence',this.value)"></div></div><label class="row" style="justify-content:flex-start;font-size:15px;color:#eaf0fa"><input type="checkbox" ${b.done?'checked':''} onchange="bikeField('done',this.checked);render()"> Kolesarjenje opravljeno</label></div>`}
function shiftDate(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');render()}
function field(k,v){getSession(date)[k]=v;save()}
function setField(i,j,k,v){getSession(date).ex[i].sets[j][k]=v;save()}
function bikeField(k,v){getSession(date).bike[k]=v;save()}
function addSet(i){let a=getSession(date).ex[i].sets;let prev=a[a.length-1]||{};a.push({kg:prev.kg||'',reps:'',done:false});save();render()}
function removeSet(i,j){let a=getSession(date).ex[i].sets;if(a.length<=1)return toast('Vaja mora imeti vsaj eno serijo');if(confirm('Odstranim to serijo?')){a.splice(j,1);save();render()}}
function addExercise(){let name=prompt('Ime nove vaje:');if(!name?.trim())return;getSession(date).ex.push({name:name.trim(),target:'8–12',rpe:'7',sets:[{kg:'',reps:'',done:false},{kg:'',reps:'',done:false},{kg:'',reps:'',done:false}]});save();render()}
function editExercise(i){let e=getSession(date).ex[i];let n=prompt('Ime vaje:',e.name);if(n===null)return;if(n.trim())e.name=n.trim();let t=prompt('Ciljne ponovitve:',e.target);if(t!==null)e.target=t;let r=prompt('Ciljni RPE:',e.rpe);if(r!==null)e.rpe=r;if(confirm('Želiš odstraniti to vajo? (Prekliči = obdrži vajo)')){if(confirm('Potrdi odstranitev vaje in vseh serij.'))getSession(date).ex.splice(i,1)}save();render()}
function history(){let items=Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h2>Zgodovina treningov</h2><p class="muted">Vsak dan ostane shranjen posebej. Izberi dan za pregled ali popravljanje.</p>${items.length?items.map(s=>`<div class="history-item"><div class="row"><div><div class="day">${esc(fmt(s.date))}</div><div class="subtle">${esc(s.name)}</div><div class="tag">${progress(s)} % serij • ${s.bike&&s.bike.actualMinutes?esc(s.bike.actualMinutes)+' min kolesa':''} ${s.pain!==''?'• golen '+esc(s.pain)+'/10':''}</div></div><button class="secondary" onclick="date='${s.date}';switchTab('today')">Odpri</button></div></div>`).join(''):'<div class="empty">Ni še treningov.</div>'}</div>`}
function plan(){return `<div class="card"><h2>Tedenski program</h2><p class="muted">Oktober–november: brez teka, aerobna baza na sobnem kolesu in prilagojen trening moči. Intenzivnejši intervali le po dodatni potrditvi varnosti.</p>${[1,2,3,4,5,6,0].map(d=>{let p=program.find(x=>x.day===d);return `<div class="history-item"><div class="day">${weekdays[d]}</div><b>${esc(p.name)}</b><div class="subtle">${p.minutes} min • ${p.ex.length} vaj${p.bike?' • kolo '+p.bike.minutes+' min':''}</div></div>`}).join('')}</div><div class="card"><h2>Progresija</h2><p><b>Zgornji del telesa:</b> ko pri vseh serijah dosežeš zgornjo mejo ponovitev z dobro tehniko in ustreznim RPE, naslednjič postopno povečaj težo.</p><p><b>Noge:</b> samo lahke, neboleče obremenitve, skladne z navodili travmatologa. Brez težkih počepov, izpadnih korakov, poskokov in sani do ustrezne potrditve.</p><p><b>Kolo:</b> najprej neboleča cona 2. Naprednejši intervali niso samodejno predpisani zaradi suma na stresno poškodbo golenice.</p><p><b>Razbremenitev:</b> približno vsak četrti teden zmanjšaj število delovnih serij za 30–40 %, če se nabira utrujenost.</p></div>`}
function backup(){return `<div class="card stack"><h2>Varnostna kopija</h2><div class="notice">Podatki so shranjeni samo v pomnilniku tega brskalnika na tej napravi. Brisanje podatkov brskalnika, zasebni način ali odpiranje datoteke drugje lahko pomeni izgubo zapisov. Redno izvozi kopijo JSON v aplikacijo Datoteke/iCloud Drive.</div><button onclick="exportJSON()">⬇ Izvozi vse podatke (JSON)</button><button class="secondary" onclick="exportCSV()">⬇ Izvozi serije (CSV)</button><label>Uvozi predhodno shranjeno JSON kopijo</label><input type="file" accept="application/json,.json" onchange="importJSON(event)"><small>Uvoz zamenja trenutno zgodovino. Pred uvozom priporočam izvoz obstoječe kopije.</small></div><div class="card stack"><h2>Upravljanje</h2><p class="muted">Vpisani podatki se shranijo ob vsaki spremembi polja ali kljukice. Nove predloge se ustvarijo za dan, ko ga prvič odpreš.</p><button class="danger" onclick="resetDay()">Ponastavi samo izbrani dan</button><small>Ne briše drugih dni.</small></div>`}
function download(filename,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('hybrid-backup-'+isoLocal()+'.json',JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2),'application/json');toast('Varnostna kopija pripravljena')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(){let rows=[['Datum','Trening','Vaja','Serija','Kg','Ponovitve','Opravljeno','RPE cilj','Bolečina goleni','Opombe','Bike minute','Bike W','Bike HR','Bike RPM']];Object.values(state.sessions).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{s.ex.forEach(e=>e.sets.forEach((z,i)=>rows.push([s.date,s.name,e.name,i+1,z.kg,z.reps,z.done?'Da':'Ne',e.rpe,s.pain,s.notes,'','','',''])));if(s.bike)rows.push([s.date,s.name,'KOLO','','','',s.bike.done?'Da':'Ne',s.bike.rpe,s.pain,s.notes,s.bike.actualMinutes,s.bike.watts,s.bike.hr,s.bike.cadence])});download('hybrid-serije-'+isoLocal()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(ev){let f=ev.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.data||!obj.data.sessions||typeof obj.data.sessions!=='object')throw Error('Napačen format');if(!confirm('Uvoz bo ZAMENJAL trenutno zgodovino. Nadaljujem?'))return;state=obj.data;save();toast('Podatki uvoženi');switchTab('history')}catch(e){alert('Napaka pri uvozu: '+e.message)}}
function resetDay(){if(confirm('Ponastavim VSE vnose za '+date+'? Tega ni mogoče razveljaviti brez kopije.')){delete state.sessions[date];save();switchTab('today')}}
render();
</script></body></html>
