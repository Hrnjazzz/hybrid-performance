</style></head><body><header><div style="max-width:720px;margin:auto"><div class="row"><div><small>TRAIN • TRACK • PROGRESS</small><h1>HYBRID PERFORMANCE</h1></div><span class="pill">2026 / 2027</span></div><div class="muted" style="font-size:13px;margin-top:7px">Tvoj osebni dnevnik • brez naročnine</div></div></header><main><div id="screen"></div></main><nav id="nav"></nav><div id="toast"></div><script>
'use strict';const KEY='hybrid_performance_v1';const weekdays=['Nedelja','Ponedeljek','Torek','Sreda','Četrtek','Petek','Sobota'];const program=[
{day:1,name:'Regeneracija in mobilnost',type:'mobility',minutes:20,ex:[['Cat-cow',2,8,0],['Torakalne rotacije',2,8,0],['Dihanje s prepono',2,8,0],['Raztezanje prsnih mišic',2,30,0]]},
{day:2,name:'Upper Strength + Bike Z2',type:'strength',minutes:90,ex:[['Bench press',4,6,80],['Weighted pull-up / assisted pull-up',4,6,0],['Incline dumbbell press',3,10,0],['Chest-supported row',3,10,0],['Lateral raise',3,15,0],['Triceps pushdown',2,15,0]],bike:{minutes:30,kind:'Z2',rpe:'3–4'}},
{day:3,name:'Bike – aerobna priprava',type:'bike',minutes:50,ex:[],bike:{minutes:40,kind:'Z2 (začetna faza)',rpe:'3–4'}},
{day:4,name:'Lahke noge + core',type:'strength',minutes:55,ex:[['Glute bridge',3,15,0],['Lying hamstring curl (lahko)',3,15,0],['Seated hip abduction (lahko)',3,20,0],['Seated hip adduction (lahko)',2,15,0],['Dead bug',3,10,0],['Side plank (sekund)',3,35,0]]},
{day:5,name:'Počitek in mobilnost',type:'mobility',minutes:15,ex:[['Dihanje s prepono',2,8,0],['Torakalne rotacije',2,8,0]]},
{day:6,name:'Upper Hypertrophy + Bike Z2',type:'strength',minutes:100,ex:[['Incline bench press',3,12,0],['Lat pulldown',3,12,0],['Seated cable row',3,12,0],['Dumbbell shoulder press',3,12,0],['Rear delt fly',3,20,0],['Cable lateral raise',3,20,0],['Hammer curl',2,15,0],['Triceps pushdown',2,15,0]],bike:{minutes:30,kind:'Z2',rpe:'3–4'}},
{day:0,name:'Dolgo kolesarjenje Z2',type:'bike',minutes:100,ex:[],bike:{minutes:90,kind:'Z2',rpe:'3–4'}}];
const isoLocal=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let state;try{state=JSON.parse(localStorage.getItem(KEY))||{sessions:{},settings:{}}}catch(e){state={sessions:{},settings:{}}}let tab='today',date=isoLocal(),viewHistory=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Shranjevanje ni uspelo – izvozi varnostno kopijo!');return false}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function templateFor(d){return program.find(x=>x.day===new Date(d+'T12:00:00').getDay())}
function newSession(d){let p=templateFor(d);return {date:d,name:p.name,type:p.type,done:false,notes:'',pain:'',ex:p.ex.map(x=>({name:x[0],target:x[2],rpe:'7',sets:Array.from({length:x[1]},()=>({kg:x[3]||'',reps:'',done:false}))})),bike:p.bike?{...p.bike,actualMinutes:'',watts:'',hr:'',cadence:'',done:false}:null}}
function getSession(d){if(!state.sessions[d]){state.sessions[d]=newSession(d);save()}return state.sessions[d]}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('sl-SI',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function progress(s){let a=s.ex.flatMap(x=>x.sets.map(z=>z.done));if(s.bike)a.push(s.bike.done);return a.length?Math.round(a.filter(Boolean).length/a.length*100):0}
function render(){document.getElementById('nav').innerHTML=[['today','Danes','calendar-days'],['history','Zgodovina','history'],['plan','Program','clipboard-list'],['backup','Podatki','database']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="switchTab('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('screen').innerHTML=tab==='today'?today():tab==='history'?history():tab==='plan'?plan():backup()}
function switchTab(t){tab=t;viewHistory=null;render()}
function today(){let s=getSession(date),pct=progress(s);return `<div class="card"><div class="row"><div><small>IZBRANI DATUM</small><h2 style="margin:4px 0">${esc(fmt(date))}</h2></div><input aria-label="Datum" type="date" value="${date}" onchange="date=this.value;render()"></div><h2 style="margin-top:14px">${esc(s.name)}</h2><div class="row"><small>Opravljene serije in kolesarjenje</small><b>${pct}%</b></div><div class="progress" style="margin:8px 0 10px"><div style="width:${pct}%"></div></div><div class="flex"><button class="secondary" onclick="shiftDate(-1)">← Prejšnji dan</button><button class="secondary" onclick="shiftDate(1)">Naslednji dan →</button></div></div><div class="notice" style="margin-bottom:13px">Golen: samo neboleče vaje, ki jih je dovolil travmatolog. VO₂max intervali šele po potrditvi, da je tudi intenzivno kolesarjenje primerno. Če se bolečina pojavi med vadbo ali naslednje jutro, zmanjšaj obremenitev in se posvetuj z zdravnikom.</div>${s.ex.length?`<div class="card"><h2>Vaje in serije</h2><small>Vpiši kg in dejanske ponovitve za vsako serijo posebej.</small>${s.ex.map((e,i)=>exerciseHtml(e,i)).join('')}<button class="secondary full" style="margin-top:14px" onclick="addExercise()">+ Dodaj vajo</button></div>`:`<div class="card"><p>Dan je namenjen ${s.type==='bike'?'kolesarjenju':'regeneraciji'}.</p><button class="secondary" onclick="addExercise()">+ Dodaj vajo</button>${s.ex.map((e,i)=>exerciseHtml(e,i)).join('')}</div>`}${s.bike?bikeHtml(s.bike):''}<div class="card stack"><h2>Po treningu</h2><label>Bolečina v goleni (0–10)</label><select onchange="field('pain',this.value)"><option value="">Izberi</option>${Array.from({length:11},(_,i)=>`<option ${String(s.pain)===String(i)?'selected':''} value="${i}">${i}</option>`).join('')}</select><label>Opombe / počutje / RPE</label><textarea placeholder="Kako je šlo? Bolečina, energija, opažanja ..." oninput="field('notes',this.value)">${esc(s.notes)}</textarea><label class="row" style="justify-content:flex-start;font-size:15px;color:#eaf0fa"><input type="checkbox" ${s.done?'checked':''} onchange="field('done',this.checked)"> Označi celoten trening kot zaključen</label><small class="success">Spremembe se samodejno shranjujejo v tem brskalniku.</small></div>`}
function exerciseHtml(e,i){return `<section class="exercise"><div class="row"><div><b>${esc(e.name)}</b><div class="subtle">${e.sets.length} serij • cilj ${esc(e.target)} ponovitev • RPE ${esc(e.rpe)}</div></div><button class="secondary" style="padding:7px 9px" onclick="editExercise(${i})">Uredi</button></div><div class="setgrid" style="margin-top:12px"><label>Ser.</label><label style="text-align:center">Kg</label><label style="text-align:center">Pon.</label><label style="text-align:center">✓</label><label></label></div>${e.sets.map((z,j)=>`<div class="setgrid"><b>${j+1}</b><input type="number" step="0.5" inputmode="decimal" aria-label="Teža serija ${j+1}" value="${esc(z.kg)}" oninput="setField(${i},${j},'kg',this.value)"><input type="number" step="1" inputmode="numeric" aria-label="Ponovitve serija ${j+1}" value="${esc(z.reps)}" oninput="setField(${i},${j},'reps',this.value)"><input type="checkbox" aria-label="Končana serija ${j+1}" ${z.done?'checked':''} onchange="setField(${i},${j},'done',this.checked);render()"><button class="remove" aria-label="Odstrani serijo" onclick="removeSet(${i},${j})">×</button></div>`).join('')}<button class="secondary" style="margin-top:6px;padding:8px 12px" onclick="addSet(${i})">+ Serija</button></section>`}
function bikeHtml(b){return `<div class="card stack"><h2>🚴 Sobno kolo</h2><div class="row"><span class="pill">${esc(b.kind)}</span><span class="pill">Cilj ${esc(b.minutes)} min • RPE ${esc(b.rpe)}</span></div><div class="row"><div style="flex:1"><label>Trajanje (min)</label><input type="number" inputmode="numeric" value="${esc(b.actualMinutes)}" oninput="bikeField('actualMinutes',this.value)"></div><div style="flex:1"><label>Povp. vati (W)</label><input type="number" inputmode="numeric" value="${esc(b.watts)}" oninput="bikeField('watts',this.value)"></div></div><div class="row"><div style="flex:1"><label>Povp. utrip (bpm)</label><input type="number" inputmode="numeric" value="${esc(b.hr)}" oninput="bikeField('hr',this.value)"></div><div style="flex:1"><label>Kadenca (rpm)</label><input type="number" inputmode="numeric" value="${esc(b.cadence)}" oninput="bikeField('cadence',this.value)"></div></div><label class="row" style="justify-content:flex-start;font-size:15px;color:#eaf0fa"><input type="checkbox" ${b.done?'checked':''} onchange="bikeField('done',this.checked);render()"> Kolesarjenje opravljeno</label></div>`}
function shiftDate(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');render()}
function field(k,v){getSession(date)[k]=v;save()}
function setField(i,j,k,v){getSession(date).ex[i].sets[j][k]=v;save()}
function bikeField(k,v){getSession(date).bike[k]=v;save()}
function addSet(i){let a=getSession(date).ex[i].sets;let prev=a[a.length-1]||{};a.push({kg:prev.kg||'',reps:'',done:false});save();render()}
function removeSet(i,j){let a=getSession(date).ex[i].sets;if(a.length<=1)return toast('Vaja mora imeti vsaj eno serijo');if(confirm('Odstranim to serijo?')){a.splice(j,1);save();render()}}
function addExercise(){let name=prompt('Ime nove vaje:');if(!name?.trim())return;getSession(date).ex.push({name:name.trim(),target:'8–12',rpe:'7',sets:[{kg:'',reps:'',done:false},{kg:'',reps:'',done:false},{kg:'',reps:'',done:false}]});save();render()}
function editExercise(i){let e=getSession(date).ex[i];let n=prompt('Ime vaje:',e.name);if(n===null)return;if(n.trim())e.name=n.trim();let t=prompt('Ciljne ponovitve:',e.target);if(t!==null)e.target=t;let r=prompt('Ciljni RPE:',e.rpe);if(r!==null)e.rpe=r;if(confirm('Želiš odstraniti to vajo? (Prekliči = obdrži vajo)')){if(confirm('Potrdi odstranitev vaje in vseh serij.'))getSession(date).ex.splice(i,1)}save();render()}
function history(){let items=Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><h2>Zgodovina treningov</h2><p class="muted">Vsak dan ostane shranjen posebej. Izberi dan za pregled ali popravljanje.</p>${items.length?items.map(s=>`<div class="history-item"><div class="row"><div><div class="day">${esc(fmt(s.date))}</div><div class="subtle">${esc(s.name)}</div><div class="tag">${progress(s)} % serij • ${s.bike&&s.bike.actualMinutes?esc(s.bike.actualMinutes)+' min kolesa':''} ${s.pain!==''?'• golen '+esc(s.pain)+'/10':''}</div></div><button class="secondary" onclick="date='${s.date}';switchTab('today')">Odpri</button></div></div>`).join(''):'<div class="empty">Ni še treningov.</div>'}</div>`}
function plan(){return `<div class="card"><h2>Tedenski program</h2><p class="muted">Oktober–november: brez teka, aerobna baza na sobnem kolesu in prilagojen trening moči. Intenzivnejši intervali le po dodatni potrditvi varnosti.</p>${[1,2,3,4,5,6,0].map(d=>{let p=program.find(x=>x.day===d);return `<div class="history-item"><div class="day">${weekdays[d]}</div><b>${esc(p.name)}</b><div class="subtle">${p.minutes} min • ${p.ex.length} vaj${p.bike?' • kolo '+p.bike.minutes+' min':''}</div></div>`}).join('')}</div><div class="card"><h2>Progresija</h2><p><b>Zgornji del telesa:</b> ko pri vseh serijah dosežeš zgornjo mejo ponovitev z dobro tehniko in ustreznim RPE, naslednjič postopno povečaj težo.</p><p><b>Noge:</b> samo lahke, neboleče obremenitve, skladne z navodili travmatologa. Brez težkih počepov, izpadnih korakov, poskokov in sani do ustrezne potrditve.</p><p><b>Kolo:</b> najprej neboleča cona 2. Naprednejši intervali niso samodejno predpisani zaradi suma na stresno poškodbo golenice.</p><p><b>Razbremenitev:</b> približno vsak četrti teden zmanjšaj število delovnih serij za 30–40 %, če se nabira utrujenost.</p></div>`}
function backup(){return `<div class="card stack"><h2>Varnostna kopija</h2><div class="notice">Podatki so shranjeni samo v pomnilniku tega brskalnika na tej napravi. Brisanje podatkov brskalnika, zasebni način ali odpiranje datoteke drugje lahko pomeni izgubo zapisov. Redno izvozi kopijo JSON v aplikacijo Datoteke/iCloud Drive.</div><button onclick="exportJSON()">⬇ Izvozi vse podatke (JSON)</button><button class="secondary" onclick="exportCSV()">⬇ Izvozi serije (CSV)</button><label>Uvozi predhodno shranjeno JSON kopijo</label><input type="file" accept="application/json,.json" onchange="importJSON(event)"><small>Uvoz zamenja trenutno zgodovino. Pred uvozom priporočam izvoz obstoječe kopije.</small></div><div class="card stack"><h2>Upravljanje</h2><p class="muted">Vpisani podatki se shranijo ob vsaki spremembi polja ali kljukice. Nove predloge se ustvarijo za dan, ko ga prvič odpreš.</p><button class="danger" onclick="resetDay()">Ponastavi samo izbrani dan</button><small>Ne briše drugih dni.</small></div>`}
function download(filename,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('hybrid-backup-'+isoLocal()+'.json',JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2),'application/json');toast('Varnostna kopija pripravljena')}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(){let rows=[['Datum','Trening','Vaja','Serija','Kg','Ponovitve','Opravljeno','RPE cilj','Bolečina goleni','Opombe','Bike minute','Bike W','Bike HR','Bike RPM']];Object.values(state.sessions).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{s.ex.forEach(e=>e.sets.forEach((z,i)=>rows.push([s.date,s.name,e.name,i+1,z.kg,z.reps,z.done?'Da':'Ne',e.rpe,s.pain,s.notes,'','','',''])));if(s.bike)rows.push([s.date,s.name,'KOLO','','','',s.bike.done?'Da':'Ne',s.bike.rpe,s.pain,s.notes,s.bike.actualMinutes,s.bike.watts,s.bike.hr,s.bike.cadence])});download('hybrid-serije-'+isoLocal()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(ev){let f=ev.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.data||!obj.data.sessions||typeof obj.data.sessions!=='object')throw Error('Napačen format');if(!confirm('Uvoz bo ZAMENJAL trenutno zgodovino. Nadaljujem?'))return;state=obj.data;save();toast('Podatki uvoženi');switchTab('history')}catch(e){alert('Napaka pri uvozu: '+e.message)}}
function resetDay(){if(confirm('Ponastavim VSE vnose za '+date+'? Tega ni mogoče razveljaviti brez kopije.')){delete state.sessions[date];save();switchTab('today')}}

 ['2027-04-26','2027-05-15','Svežina za Radence','Postopno manj teka in moči. 15. 5. glavni maraton.']
];
function addDays(d,n){let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function diffDays(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000)}
function monday(d){return addDays(d,-((new Date(d+'T12:00:00').getDay()+6)%7))}
function blockFor(d){return BLOCKS.find(b=>d>=b[0]&&d<=b[1])||[d,d,d<'2026-10-19'?'Prejšnji dnevnik':'Regeneracija po maratonu','Po tekmi počitek in postopna vrnitev po počutju.']}
function sourceHtml(keys){return `<div class="source">Viri: ${[...new Set(keys)].map(k=>`<a href="${SOURCES[k][1]}" target="_blank" rel="noopener">${esc(SOURCES[k][0])}</a>`).join(' · ')}</div>`}
function settings(){state.settings=state.settings||{};if(!state.settings.planV2Initialized){state.settings.runFrom=state.settings.runFrom||'2026-12-01';state.settings.baseFrom=state.settings.baseFrom||'2027-01-11';state.settings.planV2Initialized=true;}return state.settings}
function enabled(k,d){let x=settings()[k];return !!x&&d>=x}
function sessionEx(name,n,reps,rpe='6–7',rest='90 s'){return {name,target:reps,rpe,rest,sets:Array.from({length:n},()=>({kg:'',reps:'',done:false}))}}
function strengthSet(which,d){let deload=Math.floor(Math.max(0,diffDays(d,'2026-10-19'))/7)%4===3;let n=deload?2:3;
 let upper=which==='A'?[['Potisk s prsi / bench press','6–10'],['Veslanje s podporo prsi','8–12'],['Vlek na prsi / lat pulldown','8–12'],['Stranski dvigi ramen','12–15'],['Dead bug (na stran)','8–10']]:[['Poševni potisk z ročkami','8–12'],['Sedeče veslanje na škripcu','8–12'],['Potisk za ramena sede','8–10'],['Face pull','12–15'],['Stranska deska (sekunde/stran)','20–40']];
 let lower=which==='A'?[['Počep do klopi / goblet squat','6–8'],['Upogib kolen na napravi','8–12'],['Dvigi na prste – iztegnjeno koleno','10–15']]:[['Počep do klopi / goblet squat','6–8'],['Romunski mrtvi dvig','6–8'],['Upogib kolen na napravi','8–12'],['Dvigi na prste – iztegnjeno koleno','10–15'],['Stopanje na nizko stopnico (na nogo)','8–10'],['Dvigi na prste sede – soleus','12–15'],['Dvig prstov proti goleni – tibialis','12–20']];
 let base=upper.map(x=>sessionEx(x[0],n,x[1]));
 if(which==='B'&&enabled('lowerFrom',d)){let late=d>='2027-03-29';base=upper.slice(0,3).map(x=>sessionEx(x[0],late?2:n,x[1]));base.push(...lower.map(x=>sessionEx(x[0],late?2:n,x[1], '6–7','90–120 s')));}
 return base;
}
function ride(minutes,kind='Aerobno',hard=false){return {minutes,kind,rpe:hard?'7–8':'3–4',actualMinutes:'',watts:'',hr:'',cadence:'',done:false,steps:hard?[['Ogrevanje',10,'Lahko; postopno dvigni dihanje.'],['Glavni del',25,'4 × 4 min močno, vmes 3 × 3 min lahko. Brez sprinta; vse štiri ponovitve enakomerno.'],['Ohlajanje',10,'Zelo lahko.']]:[['Enakomerna vožnja',minutes,'Pogovorni napor; pri daljši vožnji prvih in zadnjih 5–10 min še lažje.']],source:hard?['vo2','bike']:['bike']}}
function running(km,kind='Lahkoten tek',detail='Pogovorni napor, RPE 3–4. Tempo prilagodi trenutni pripravljenosti.'){return {km,kind,detail,actualKm:'',actualMinutes:'',hr:'',rpe:'',done:false,source:['run']}}
// Original combined calendar, inspired by the linked coaching frameworks; not an official reprint.
// Values are optional planning ceilings, never a required post-injury progression.
const RUN_WEEKS=[
 [5,7,5,4,12,'easy'],[6,8,5,4,14,'easy'],[6,9,6,4,16,'easy'],[5,7,5,0,12,'easy'],
 [7,10,6,5,18,'tempo'],[7,11,7,5,20,'tempo'],[8,12,7,5,22,'tempo'],[6,9,6,4,16,'easy'],
 [8,12,7,5,22,'tempo'],[6,7,4,0,21.0975,'race'],[4,6,5,0,8,'easy'],
 [8,12,7,5,24,'mp'],[8,13,8,5,28,'mp'],[7,10,6,4,21,'easy'],[8,13,8,5,30,'mp'],
 [7,10,6,4,22,'mp'],[5,8,5,3,14,'easy'],[4,5,3,42.195,0,'marathon']
];
function templateFor(d){
 let wd=new Date(d+'T12:00:00').getDay(),b=blockFor(d),p={date:d,name:'Počitek',type:'rest',planVersion:PLAN_VERSION,block:b[2],done:false,notes:'',pain:'',ex:[],bike:null,run:null,detail:'Počitek ali nežna mobilnost po počutju.',sources:[]};
 if(d<'2026-10-19'||d>'2027-05-15')return p;
 if(wd===1||wd===5){p.name='Počitek in regeneracija';return p;}
 let strengthDays=[2,4];
 if(strengthDays.includes(wd)){p.name='Moč '+(wd===2?'A':'B');p.type='strength';p.ex=strengthSet(wd===2?'A':'B',d);p.detail='Prilagojen hibridni trening. 5–10 min ogrevanja; 2–3 ponovitve v rezervi. Glavne vaje: 90–120 s počitka; dodatne: 60–90 s. Ko vse serije dosežejo vrh razpona z ustreznim naporom, naslednjič najmanjši možen dvig bremena. Brez napredovanja ob bolečini.';p.sources=['strength','sample'];}
 if(d<'2026-11-30'){
  let w=Math.floor(Math.max(0,diffDays(d,'2026-10-19'))/7),recovery=w%4===3;
  if([3,6,0].includes(wd)){let mins=wd===0?[50,60,70,50,80,90][Math.min(w,5)]:wd===3?45:40;
   let hard=wd===3&&w>=2&&!recovery&&enabled('bikeHardFrom',d);
   p.bike=ride(hard?45:mins,hard?'VO₂max 4 × 4':'Aerobna baza',hard);p.name=hard?'Kolo – VO₂max 4 × 4':'Kolo – '+(wd===0?'daljša aerobna vožnja':'aerobna baza');p.type='bike';p.detail=recovery?'Razbremenilni teden. Vse lahkotno.':'Brez kolesarskega tekmovalnega cilja: aerobna vzdržljivost in kakovostna intenzivnost.';p.sources=p.bike.source;
  }
  return p;
 }
 if(d<'2027-01-11'||!enabled('baseFrom',d)||(settings().baseFrom&&settings().baseFrom>'2027-01-11')){
  
  if([2,4,0].includes(wd)&&enabled('runFrom',d)){
   p.name=(p.ex.length?'Moč + ':'')+'vrnitev k teku po fizioterapevtu';p.type=p.ex.length?'combined':'run';p.detail='Prednost ima individualni protokol fizioterapevta. Ne preskakuj stopenj zaradi koledarja. Če se lokalna bolečina vrne, prekini tek in se uskladi z njim.';
   p.run=running('', 'Vrnitev: hoja / lahek tek',settings().returnProtocol||'Vpiši protokol fizioterapevta v Program → Nastavitve. Predloge teka se ne stopnjujejo samodejno.');p.run.source=['rehab'];p.sources=['rehab'];
  }else if([3,6,0].includes(wd)){p.bike=ride(wd===0?60:40);p.name='Kolo – aerobno';p.type='bike';p.sources=['bike'];}
  return p;
 }
 let w=Math.floor(diffDays(d,'2027-01-11')/7),v=RUN_WEEKS[Math.max(0,Math.min(w,17))];
 let ix={2:0,3:1,4:2,6:3,0:4}[wd],km=v[ix];
 if(km){p.run=running(km);p.type=p.ex.length?'combined':'run';p.name=(p.ex.length?p.name+' + ':'')+'lahek tek '+km+' km';p.sources.push('run');
  if(wd===0){p.run.kind='Dolg lahek tek';p.run.detail='Pogovorni napor. Dolžina je načrtovalna zgornja meja, ne obveznost; skrajšaj, če je ne podpira dosedanji obseg. Na dolgih tekih preizkušaj prehrano in pitje.';p.name='Dolg tek '+km+' km';}
  if(wd===3&&v[5]==='tempo'){p.run.kind='Nadzorovan tempo';p.run.source=['half'];p.run.detail='Skupaj '+km+' km: 2 km ogrevanja, 3 × 6 min nadzorovano pri RPE 6–7 (vmes 2 min lahkega teka), nato lahkotno do skupne razdalje. Trenutni napor ima prednost pred ciljem 4:15/km.';p.name='Tempo tek '+km+' km';p.sources.push('half');}
  if(wd===3&&v[5]==='mp'){p.run.kind='Maratonski tempo';p.run.detail='Skupaj '+km+' km: 2 km lahkotno, 2 × 3 km pri trenutnem maratonskem naporu z 1 km lahkotno vmes, preostanek lahkotno. Cilj približno 4:37/km uporabi šele, ko ga potrjuje pripravljenost.';p.name='Maratonski tempo '+km+' km';}
 }
 if(w===9){p.ex=[];p.name=p.run?'Zagreb – lahkotno pred tekmo':'Počitek pred Zagrebom';if(d==='2027-03-21'){p.run=running(21.0975,'ZAGREB21 – cilj pod 1:30','Tekmovalni tempo približno 4:15–4:16/km, če ga potrjuje trenutna forma. Ogrevanje po navadi; brez dodatnega dolgega teka.');p.name=p.run.kind;}}
 if(w===10){p.ex=[];p.detail='Okrevanje po Zagrebu. Brez hitrih tekov ali težkih nog; po potrebi tek zamenjaj z lahkim kolesom.';}
 if(w>=15){p.ex=p.ex.map(e=>({...e,sets:e.sets.slice(0,w===17?1:2)}));p.detail+=' Zmanjševanje obsega pred maratonom; ne povečuj bremen.';}
 if(w===17){p.ex=[];if(d==='2027-05-15'){p.run=running(42.195,'RADENCI – cilj pod 3:15','Cilj približno 4:37/km. Upoštevaj vreme, počutje in preizkušen načrt prehrane.');p.name=p.run.kind;}}
 return p;
}
function newSession(d){return templateFor(d)}
function getSession(d){if(!state.sessions[d]){state.sessions[d]=newSession(d);save()}return state.sessions[d]}
function progress(s){let a=(s.ex||[]).flatMap(x=>x.sets.map(z=>z.done));if(s.bike)a.push(s.bike.done);if(s.run)a.push(s.run.done);return a.length?Math.round(a.filter(Boolean).length/a.length*100):(s.done?100:0)}
function render(){document.getElementById('nav').innerHTML=[['today','Danes'],['history','Zgodovina'],['plan','Program'],['backup','Podatki']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="switchTab('${x[0]}')">${x[1]}</button>`).join('');document.getElementById('screen').innerHTML=tab==='today'?today():tab==='history'?history():tab==='plan'?plan():backup()}
function today(){let s=getSession(date),pct=progress(s);return `<div class="card"><div class="row"><small>${esc(s.block||'Prejšnji program')}</small><input aria-label="Datum" type="date" value="${date}" onchange="if(this.value){date=this.value;render()}"></div><h2 style="margin-top:12px">${esc(fmt(date))}</h2><h3>${esc(s.name)}</h3><div class="progress"><div style="width:${pct}%"></div></div><p class="muted">${esc(s.detail||'Tvoj shranjeni trening iz prejšnjega programa.')}</p><div class="flex"><button class="secondary" onclick="shiftDate(-1)">← Prejšnji</button><button class="secondary" onclick="date=isoLocal();render()">Danes</button><button class="secondary" onclick="shiftDate(1)">Naslednji →</button></div></div>${!s.planVersion?`<div class="notice">Ohranjen je prejšnji zapis. Za novo predlogo uporabi »Podatki → Ponastavi izbrani dan« samo, če ta zapis ni pomemben.</div>`:''}${s.ex.length?`<div class="card"><h2>Moč</h2><small>Ogrevalne serije niso vštete. Bremena izberi glede na tehniko in ciljni RPE.</small>${s.ex.map((e,i)=>exerciseHtml(e,i)).join('')}<button class="secondary full" onclick="addExercise()">+ Dodaj vajo fizioterapevta ali drugo vajo</button></div>`:''}${s.bike?bikeHtml(s.bike):''}${s.run?runHtml(s.run):''}${!s.ex.length&&!s.bike&&!s.run?`<div class="card"><p>${esc(settings().returnProtocol||'Počitek. Rehabilitacija po individualnem dogovoru.')}</p><button class="secondary" onclick="addExercise()">+ Dodaj vajo</button></div>`:''}<div class="card stack"><h2>Po treningu</h2><label>Bolečina v goleni (0–10)</label><select onchange="field('pain',this.value)"><option value="">Izberi</option>${Array.from({length:11},(_,i)=>`<option ${String(s.pain)===String(i)?'selected':''}>${i}</option>`).join('')}</select><label>Opombe / počutje</label><textarea oninput="field('notes',this.value)">${esc(s.notes)}</textarea><label class="row"><input type="checkbox" ${s.done?'checked':''} onchange="field('done',this.checked);render()"> Trening zaključen</label><small>Samodejno shranjevanje samo v tem brskalniku.</small></div><div class="card">${sourceHtml(s.sources||[])}</div>`}
const originalBikeHtml=bikeHtml;
// Function wrappers are assigned after declarations to retain the v1 journal fields.
function detailedBikeHtml(b){return originalBikeHtml(b)+`<div class="card"><h3>Potek kolesarjenja</h3>${(b.steps||[]).map(x=>`<div class="work"><b>${esc(x[0])} · ${x[1]} min</b><p>${esc(x[2])}</p></div>`).join('')}<p class="subtle">Aerobno: RPE 3–4/10, pogovor v stavkih. Intervali: močno, nadzorovano, brez lovljenja pulza v prvi minuti. CERG okvir je 85–95 % dejanskega maksimalnega utripa proti koncu intervala; kolesarskega maksimuma ne ocenjuj iz tekaškega. Brez merilnika moči uporabljaj napor. Vožnjo v službo vštej v skupno obremenitev.</p></div>`}
bikeHtml=detailedBikeHtml;
function runHtml(r){return `<div class="card stack"><h2>Tek</h2><span class="pill">${esc(r.kind)}${r.km?' · '+r.km+' km':''}</span><p>${esc(r.detail)}</p><div class="grid2"><div><label>Dejanska razdalja (km)</label><input type="number" min="0" step="0.01" value="${esc(r.actualKm)}" oninput="runField('actualKm',this.value)"></div><div><label>Čas (min, decimalno)</label><input type="number" min="0" step="0.1" value="${esc(r.actualMinutes)}" oninput="runField('actualMinutes',this.value)"></div><div><label>Povprečni utrip</label><input type="number" min="0" value="${esc(r.hr)}" oninput="runField('hr',this.value)"></div><div><label>Dejanski RPE 1–10</label><input type="number" min="1" max="10" value="${esc(r.rpe)}" oninput="runField('rpe',this.value)"></div></div><label class="row"><input type="checkbox" ${r.done?'checked':''} onchange="runField('done',this.checked);render()"> Tek opravljen</label></div>`}
function runField(k,v){getSession(date).run[k]=v;save()}
function setting(k,v){settings()[k]=v;save();toast('Nastavitev shranjena. Obstoječi dnevniki ostanejo ohranjeni.');}
function weekSummary(d){let days=Array.from({length:7},(_,i)=>templateFor(addDays(monday(d),i)));return {days,km:days.reduce((n,s)=>n+(Number(s.run?.km)||0),0),bike:days.reduce((n,s)=>n+(Number(s.bike?.minutes)||0),0)}}
function weekCard(d){let x=weekSummary(d);return `<div class="card"><h2>Teden od ${esc(monday(d))}</h2><div class="flex"><span class="pill">Načrt teka: ${x.km.toFixed(1)} km</span><span class="pill">Kolo: ${x.bike} min</span></div>${x.days.map(s=>`<button class="secondary weekbtn" onclick="date='${s.date}';switchTab('today')"><small>${esc(fmt(s.date))}</small><br>${esc(s.name)}</button>`).join('')}</div>`}
function plan(){let st=settings();return `<div class="card"><small>SEZONA 2026 / 2027</small><h2>Zagreb → Radenci</h2><div class="grid2"><div><div class="metric">1:29:xx</div><p>21. marec · Zagreb<br>cilj približno 4:15/km</p></div><div><div class="metric">3:14:xx</div><p>15. maj · Radenci<br>cilj približno 4:37/km</p></div></div><p>Enoten, prilagojen urnik. Kolesarski del podpira aerobno pripravljenost in VO₂max; s povečanjem teka se dodatna obremenitev zmanjšuje. Noben cilj ni zagotovljen.</p></div><div class="card"><h2>Faze in navodila fizioterapevta</h2><p class="muted">Datumi za tek so začetne načrtovane predpostavke, ne potrdilo pripravljenosti. Uskladi jih s fizioterapevtom. Datumi spodaj določijo prikaz predlog. Ne spreminjajo že shranjenih dnevnikov. Za tek in noge uporabi dogovor s svojim fizioterapevtom.</p>${[['bikeHardFrom','Intenzivno kolo od'],['runFrom','Vrnitev k lahkemu teku od'],['baseFrom','Redni tekaški program od'],['lowerFrom','Vadba moči nog od']].map(x=>`<label>${x[1]}<input type="date" value="${esc(st[x[0]]||'')}" onchange="setting('${x[0]}',this.value)"></label><br>`).join('')}<p class="subtle">Redni tekaški program je predviden od 11. januarja samo ob že vzpostavljeni bazi: več tednov rednega nebolečega teka, približno 30 km/teden in dolg tek okoli 10–12 km. Če prideš do tega pozneje, ne začni v višjem tednu. Če začetek rednega programa nastaviš po 11. januarju, aplikacija ohrani prehodne predloge namesto preskakovanja v višji teden. Dogovorjeni protokol vnesi spodaj; koledar naj v tem primeru prilagodi trener.</p><label>Protokol vrnitve in omejitve<textarea oninput="settingQuiet('returnProtocol',this.value)">${esc(st.returnProtocol||'')}</textarea></label><p class="subtle">Ne povečuj sočasno trajanja, hitrosti in števila tekov. Bolečina v kostni točki pomeni prekinitev obremenitve in pogovor s fizioterapevtom.</p></div>${weekCard(date)}<div class="card"><h2>Bloki do maratona</h2>${BLOCKS.map(b=>`<details><summary>${esc(b[2])}<br><small>${b[0]} – ${b[1]}</small></summary><p>${esc(b[3])}</p><button class="secondary" onclick="date='${b[0]}';render()">Poglej prvi teden</button></details>`).join('')}</div><div class="card"><h2>Pravila skupnega programa</h2><p>Oktober–november: 3 vožnje in 2 treninga zgornjega dela/trupa; noge po fizioterapevtu. Po uvajanju največ 1 intenzivna vožnja tedensko. Lahkotne vožnje v službo štejejo zraven.</p><p>Tek: ponedeljek in petek počitek, torek/četrtek lahkotno z močjo, sreda glavni tek, sobota kratek lahek tek in nedelja dolg tek. V uvajanju peti tek ni obvezen. Pri prehodu zamenjuj kolo s tekom, ne dodajaj vseh enot skupaj.</p><p>Moč: torek zgornji del in trup, četrtek celotno telo z nogami po odobritvi; sredin glavni tek tako ne sledi težki vadbi nog. BPN navdih za kombinacijo potiskov, vlečenj in nog, z bistveno manj serijami za maratonsko pripravo. Na začetku RPE 6–7, brez serij do odpovedi. Pri krajših tednih zmanjšaš serije. Vaje za meča, soleus in sprednjo golen šele v dovoljeni fazi.</p><p>Zagreb: manj obsega pred tekmo in lahek teden po njej. Zadnji daljši maratonski tek je predviden 25. aprila, tri tedne pred Radenci. Zadnji trije tedni postopno manj obsega.</p></div><div class="card"><h2>Viri in obseg prilagoditve</h2><p>To je individualno sestavljen skupni koledar, ne uradni ali nespremenjeni program spodnjih avtorjev. Kombiniranega programa avtorji niso pregledali. Izvirni programi so na povezavah.</p><p>British Cycling daje okvir strukturiranega kolesarskega tedna; celoten plačljivi načrt ni prepisan. Za aerobne intervale je uporabljen protokol NTNU/CERG. BPN je vir hibridnega pristopa, nabor in manjši obseg moči sta prilagojena. Higdonova programa sta osnova za razpored lahkih, dolgih, tempo tekov in pripravljalne tekme; konkretna kilometrina in združevanje sta prilagoditev za ta koledar.</p>${Object.keys(SOURCES).map(k=>`<p>${sourceHtml([k])}</p>`).join('')}</div>`}
function settingQuiet(k,v){settings()[k]=v;save()}
function history(){let items=Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date));let runKm=items.reduce((n,s)=>n+(Number(s.run?.actualKm)||0),0),bikeMin=items.reduce((n,s)=>n+(Number(s.bike?.actualMinutes)||0),0);return `<div class="card"><h2>Zgodovina</h2><div class="flex"><span class="pill">Tek: ${runKm.toFixed(1)} km</span><span class="pill">Kolo: ${bikeMin} min</span></div>${items.map(s=>`<div class="history-item"><small>${esc(fmt(s.date))}</small><h3>${esc(s.name)}</h3><p class="subtle">${s.done?'Zaključeno':'V teku'} · ${progress(s)} %${s.run?.actualKm?' · '+esc(s.run.actualKm)+' km':''}${s.bike?.actualMinutes?' · '+esc(s.bike.actualMinutes)+' min kolesa':''}</p><button class="secondary" onclick="date='${esc(s.date)}';switchTab('today')">Odpri</button></div>`).join('')}</div>`}
function exportCSV(){let rows=[['Datum','Trening','Disciplina','Vaja','Serija','Kg','Ponovitve','Opravljeno','RPE','Golen','Opombe','Minute','Km','W','HR','RPM']];Object.values(state.sessions).sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{s.ex.forEach(e=>e.sets.forEach((z,i)=>rows.push([s.date,s.name,'Moč',e.name,i+1,z.kg,z.reps,z.done,e.rpe,s.pain,s.notes])));if(s.bike)rows.push([s.date,s.name,'Kolo','','','','',s.bike.done,s.bike.rpe,s.pain,s.notes,s.bike.actualMinutes,'',s.bike.watts,s.bike.hr,s.bike.cadence]);if(s.run)rows.push([s.date,s.name,'Tek','','','','',s.run.done,s.run.rpe,s.pain,s.notes,s.run.actualMinutes,s.run.actualKm,'',s.run.hr,'']);if(!s.ex.length&&!s.run&&!s.bike)rows.push([s.date,s.name,'Počitek','','','','',s.done,'',s.pain,s.notes])});download('hybrid-treningi-'+isoLocal()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}

render();
</script></body></html>
